<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abou Rowais | أدوات مدرسية ومستلزمات مكتبية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--b:#1456d6;--bd:#0b3a9e;--bl:#eaf1ff;--bg:#f5f8ff;--card:#fff;--tx:#0f1b3d;--mut:#5b6b8c;--line:#dce6fb;--g:#1fa855;--r:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1226;--card:#121c38;--tx:#eaf0ff;--mut:#9fb0d6;--line:#22305a;--bl:#16254d}}
:root[data-theme="dark"]{--bg:#0a1226;--card:#121c38;--tx:#eaf0ff;--mut:#9fb0d6;--line:#22305a;--bl:#16254d}
html{scroll-padding-top:70px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
button,input{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 12px #1456d614}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--bd)}
.logo b{font-size:19px;font-weight:800;letter-spacing:.3px;direction:ltr;color:var(--b)}
.logo small{display:block;font-size:10px;color:var(--mut);direction:ltr;margin-top:-6px}
.cartbtn{margin-inline-start:auto;position:relative;background:var(--b);color:#fff;border:0;border-radius:12px;padding:8px 14px;font-weight:600;cursor:pointer}
.cartbtn i{position:absolute;top:-6px;inset-inline-start:-6px;background:#ef4444;color:#fff;font-style:normal;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center}
main{max-width:1100px;margin:auto;padding:14px}
.hero{background:linear-gradient(135deg,var(--bd),var(--b) 60%,#4c8dff);color:#fff;border-radius:22px;padding:24px 18px;position:relative;overflow:hidden}
.hero:after{content:"✏️📚📐";position:absolute;inset-inline-end:10px;bottom:-6px;font-size:54px;opacity:.22;letter-spacing:6px}
.hero h1{font-size:24px;font-weight:800;line-height:1.4}.hero p{opacity:.92;margin:6px 0 14px;font-size:14px}
.search{display:flex;background:#fff;border-radius:14px;padding:4px;max-width:480px}
.search input{flex:1;border:0;outline:0;background:none;padding:8px 12px;color:#0f1b3d;min-width:0}
.search button{border:0;background:var(--b);color:#fff;border-radius:11px;padding:0 16px;cursor:pointer}
h2{font-size:19px;font-weight:800;margin:22px 0 10px;color:var(--bd)}
@media(prefers-color-scheme:dark){h2{color:#8db4ff}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:99px;cursor:pointer;font-weight:600;font-size:14px}
.chip.on{background:var(--b);border-color:var(--b);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;position:relative}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bl)}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:#ef4444;color:#fff;font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px}
.info{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.info small{color:var(--mut);font-size:12px}.info h3{font-size:14px;font-weight:600;line-height:1.4}
.price{font-weight:800;color:var(--b);margin-top:auto}.price s{color:var(--mut);font-weight:400;font-size:12px;margin-inline-start:6px}
.add{border:0;background:var(--bl);color:var(--b);font-weight:700;border-radius:11px;padding:8px;cursor:pointer;margin-top:6px}
.add:active{background:var(--b);color:#fff}
.empty{text-align:center;color:var(--mut);padding:30px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:24px 14px 30px}
.ov{position:fixed;inset:0;background:#0008;z-index:30;display:none}.ov.on{display:block}
.sheet{position:fixed;z-index:31;bottom:0;inset-inline:0;max-width:560px;margin:auto;background:var(--card);border-radius:22px 22px 0 0;max-height:88%;display:none;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{display:flex}
.sh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:800}
.x{border:0;background:var(--bl);width:34px;height:34px;border-radius:50%;cursor:pointer}
.items{overflow-y:auto;padding:6px 16px;flex:1}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.it img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.it div.n{flex:1;font-size:14px;font-weight:600}.it div.n small{display:block;color:var(--mut);font-weight:400}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:800}
.del{border:0;background:none;cursor:pointer;font-size:18px}
.foot{padding:12px 16px;border-top:1px solid var(--line);display:grid;gap:8px}
.foot input{border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:9px 12px;outline:0;width:100%}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:17px}
.wa{display:flex;justify-content:center;gap:8px;align-items:center;background:var(--g);color:#fff;text-decoration:none;border:0;border-radius:13px;padding:12px;font-weight:800;font-size:16px;cursor:pointer}
.wa[aria-disabled="true"]{opacity:.45;pointer-events:none}
.toast{position:fixed;bottom:84px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#0f1b3d;color:#fff;padding:8px 16px;border-radius:99px;font-size:14px;z-index:40;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="#top" aria-label="Abou Rowais">
    <svg width="42" height="42" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="13" fill="#1456d6"/><path d="M10 15c5-2 9-1 14 2v18c-5-3-9-4-14-2z" fill="#fff"/><path d="M38 15c-5-2-9-1-14 2v18c5-3 9-4 14-2z" fill="#cfe0ff"/><path d="M33 8l5 5-9 9-6 1 1-6z" fill="#ffc83d"/></svg>
    <span><b>Abou Rowais</b><small>School &amp; Office Supplies</small></span>
  </a>
  <button class="cartbtn" id="openCart">🛒 السلة<i id="count">0</i></button>
</div></header>

<main id="top">
  <section class="hero">
    <h1>كل ما تحتاجه للدخول المدرسي<br>في مكان واحد</h1>
    <p>أدوات مدرسية ولوازم مكتبية بأسعار مناسبة — الطلب عبر واتساب</p>
    <div class="search"><input id="q" type="search" placeholder="ابحث عن كراس، قلم، محفظة…" aria-label="بحث"><button id="go">بحث</button></div>
  </section>

  <h2 id="offersT">🔥 عروض خاصة</h2>
  <div class="grid" id="offers"></div>

  <h2>الأقسام</h2>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid" style="margin-top:12px"></div>
</main>
<footer>© Abou Rowais — الجزائر · الأسعار توضيحية وقابلة للتعديل</footer>

<div class="ov" id="ov"></div>
<aside class="sheet" id="sheet" aria-label="سلة المشتريات">
  <div class="sh"><span>🛒 سلة المشتريات</span><button class="x" id="close" aria-label="إغلاق">✕</button></div>
  <div class="items" id="items"></div>
  <div class="foot">
    <div class="tot"><span>المجموع</span><span id="total">0 DZD</span></div>
    <input id="name" placeholder="الاسم الكامل (اختياري)" autocomplete="name">
    <input id="addr" placeholder="الولاية / العنوان (اختياري)" autocomplete="street-address">
    <a class="wa" id="wa" href="#" target="_blank" rel="noopener" aria-disabled="true">
      <span aria-hidden="true">💬</span> تأكيد الطلب عبر واتساب</a>
  </div>
</aside>
<div class="toast" id="toast"></div>

<script>
/* ===== إعدادات قابلة للتعديل ===== */
const WHATSAPP_NUMBER = "213550948626";
const CURRENCY = "DZD";
const CATS = {notebooks:"الكراريس", pens:"الأقلام", bags:"المحافظ المدرسية", geo:"الأدوات الهندسية", books:"الكتب واللوازم المكتبية"};
/* لإضافة صورة حقيقية: أضف الحقل img:"https://.../photo.jpg" للمنتج (وإلا تظهر صورة توضيحية) */
const PRODUCTS = [
 {id:1,cat:"notebooks",name:"كراس 96 ورقة (مجموعة 5)",price:450,old:550,e:"📒",c:"#1456d6"},
 {id:2,cat:"notebooks",name:"كراس 192 ورقة مسطّر",price:180,e:"📓",c:"#2f6fe8"},
 {id:3,cat:"notebooks",name:"دفتر رسم A4",price:220,e:"🎨",c:"#4c8dff"},
 {id:4,cat:"pens",name:"أقلام جاف زرقاء (علبة 10)",price:250,old:300,e:"🖊️",c:"#0b3a9e"},
 {id:5,cat:"pens",name:"أقلام رصاص HB (12)",price:200,e:"✏️",c:"#3b82f6"},
 {id:6,cat:"pens",name:"أقلام تلوين خشبية (24 لون)",price:650,e:"🖍️",c:"#1d4ed8"},
 {id:7,cat:"pens",name:"قلم حبر مع خراطيش",price:350,e:"🖋️",c:"#1456d6"},
 {id:8,cat:"bags",name:"محفظة مدرسية للابتدائي",price:3200,old:3800,e:"🎒",c:"#0b3a9e"},
 {id:9,cat:"bags",name:"محفظة ظهر للمتوسط",price:4500,e:"🎒",c:"#2f6fe8"},
 {id:10,cat:"bags",name:"مقلمة قماشية كبيرة",price:500,e:"👝",c:"#4c8dff"},
 {id:11,cat:"geo",name:"طقم أدوات هندسية (5 قطع)",price:600,old:750,e:"📐",c:"#1456d6"},
 {id:12,cat:"geo",name:"فرجار معدني",price:450,e:"📏",c:"#1d4ed8"},
 {id:13,cat:"geo",name:"آلة حاسبة علمية",price:1800,e:"🧮",c:"#0b3a9e"},
 {id:14,cat:"books",name:"قاموس عربي - فرنسي",price:1500,e:"📘",c:"#2f6fe8"},
 {id:15,cat:"books",name:"مقص + لصاق + مسطرة",price:350,e:"✂️",c:"#3b82f6"},
 {id:16,cat:"books",name:"حافظة ملفات بلاستيكية",price:300,old:380,e:"🗂️",c:"#1456d6"}
];
/* ================================== */
const $=s=>document.querySelector(s), fmt=n=>String(n).replace(/\B(?=(\d{3})+$)/g," ")+" "+CURRENCY;
const img=p=>p.img||"data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="${p.c}" stop-opacity=".35"/></linearGradient></defs><rect width="200" height="200" fill="url(#g)"/><circle cx="100" cy="100" r="62" fill="#fff" opacity=".8"/><text x="100" y="128" font-size="80" text-anchor="middle">${p.e}</text></svg>`);
let cat="all",q="",cart={};
try{cart=JSON.parse(localStorage.getItem("ar_cart")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("ar_cart",JSON.stringify(cart))}catch(e){}};
const byId=id=>PRODUCTS.find(p=>p.id==id);

function card(p){return `<article class="card">${p.old?`<span class="tag">-${Math.round((1-p.price/p.old)*100)}%</span>`:""}<img loading="lazy" src="${img(p)}" alt="${p.name}"><div class="info"><small>${CATS[p.cat]}</small><h3>${p.name}</h3><div class="price">${fmt(p.price)}${p.old?`<s>${fmt(p.old)}</s>`:""}</div><button class="add" data-add="${p.id}">+ أضف إلى السلة</button></div></article>`}
function render(){
  const term=q.trim().toLowerCase(), list=PRODUCTS.filter(p=>(cat=="all"||p.cat==cat)&&(!term||(p.name+CATS[p.cat]).toLowerCase().includes(term)));
  $("#grid").innerHTML=list.length?list.map(card).join(""):'<div class="empty" style="grid-column:1/-1">لا توجد نتائج مطابقة 🔍</div>';
  const off=PRODUCTS.filter(p=>p.old);$("#offers").innerHTML=off.map(card).join("");
  $("#chips").innerHTML=[["all","الكل"],...Object.entries(CATS)].map(([k,v])=>`<button class="chip ${k==cat?"on":""}" data-cat="${k}">${v}</button>`).join("");
  $("#offersT").style.display=$("#offers").style.display=term?"none":"";
}
function renderCart(){
  const ids=Object.keys(cart).filter(id=>byId(id)&&cart[id]>0);let total=0,n=0;
  $("#items").innerHTML=ids.length?ids.map(id=>{const p=byId(id),k=cart[id];total+=p.price*k;n+=k;return `<div class="it"><img src="${img(p)}" alt=""><div class="n">${p.name}<small>${fmt(p.price)}</small></div><div class="qty"><button data-d="1" data-id="${id}" aria-label="زيادة">+</button><b>${k}</b><button data-d="-1" data-id="${id}" aria-label="إنقاص">−</button></div><button class="del" data-rm="${id}" aria-label="حذف">🗑️</button></div>`}).join(""):'<div class="empty">السلة فارغة 🛒<br>أضف بعض المنتجات للبدء</div>';
  $("#total").textContent=fmt(total);$("#count").textContent=n;$("#count").style.display=n?"grid":"none";
  const wa=$("#wa");wa.setAttribute("aria-disabled",ids.length?"false":"true");
  let m="السلام عليكم، أريد تأكيد الطلب التالي من Abou Rowais:\n\n";
  ids.forEach((id,i)=>{const p=byId(id);m+=`${i+1}) ${p.name}\n   الكمية: ${cart[id]} × ${fmt(p.price)} = ${fmt(p.price*cart[id])}\n`});
  m+=`\nالمجموع الكلي: ${fmt(total)}`;
  if($("#name").value.trim())m+=`\nالاسم: ${$("#name").value.trim()}`;
  if($("#addr").value.trim())m+=`\nالولاية/العنوان: ${$("#addr").value.trim()}`;
  wa.href=`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(m)}`;save();
}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1300)}
const open=v=>{$("#ov").classList.toggle("on",v);$("#sheet").classList.toggle("on",v)};
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-add],[data-cat],[data-d],[data-rm]");if(!t)return;
  if(t.dataset.add){cart[t.dataset.add]=(cart[t.dataset.add]||0)+1;renderCart();toast("تمت الإضافة إلى السلة ✓")}
  else if(t.dataset.cat){cat=t.dataset.cat;render()}
  else if(t.dataset.d){const id=t.dataset.id;cart[id]=Math.max(0,(cart[id]||0)+ +t.dataset.d);if(!cart[id])delete cart[id];renderCart()}
  else if(t.dataset.rm){delete cart[t.dataset.rm];renderCart()}
});
$("#openCart").onclick=()=>open(true);$("#close").onclick=$("#ov").onclick=()=>open(false);
$("#q").oninput=e=>{q=e.target.value;render()};$("#go").onclick=()=>$("#grid").scrollIntoView({behavior:"smooth"});
$("#name").oninput=$("#addr").oninput=renderCart;
render();renderCart();
</script>
</body>
</html>
